services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: adpilot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: $$$$$$$$$$$$$$$$$$$$$$44444
    ports:
      - "5432:5432"
